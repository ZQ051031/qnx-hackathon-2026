name: Linux host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest ruff
      - run: python -m pytest
      - run: ruff check .
      - if: matrix.python == '3.13'
        run: qnxport scan examples/linux-only --relative-to . --format sarif --fail-on none > qnxport-example.sarif
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: qnxport-example-sarif
          path: qnxport-example.sarif
