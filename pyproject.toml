[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qnxport"
version = "0.1.0"
description = "Linux host portability tools for QNX 8.0"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
qnxport = "qnxport.cli:main"

[tool.setuptools]
packages = ["qnxport"]

[tool.setuptools.package-data]
qnxport = ["rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
